schema_version: HC_CONFORMANCE_SUITE_V1
status: CANONICAL_ARCHITECTURE_CONFORMANCE_BASELINE
scope: HC_REUSABLE_TEMPLATE

outcomes:
  - PASS
  - CONDITIONAL_PASS
  - FAIL

qualification_boundaries:
  architecture_conformance_equals_implementation_conformance: false
  implementation_conformance_equals_behavioral_qualification: false
  behavioral_qualification_equals_scientific_validation: false
  test_pass_equals_consciousness_proof: false
  pass_is_snapshot_bound: true
  pass_is_capability_bound: true
  pass_is_scope_bound: true

required_result_fields:
  - qualification_id
  - target_kind
  - target_ref
  - tested_capability
  - test_scope
  - evidence_snapshot
  - checks
  - observed_failures
  - unresolved_uncertainty
  - outcome
  - timestamp
  - evaluator
  - provenance

architecture_checks:
  - id: HC-ARCH-001
    category: REPOSITORY_STRUCTURE
    severity: BLOCKER
    requirement: ALL_MANDATORY_TOP_LEVEL_SYSTEMS_EXIST
    evidence:
      - specs/HC_COGNITIVE_ORGAN_INVARIANTS_V1.yaml
      - docs/REPOSITORY_MAP.md
    assertions:
      - NO_BRAIN_WRAPPER_AROUND_CANONICAL_SUBSYSTEMS
      - NO_NODES_WRAPPER_AROUND_CANONICAL_SUBSYSTEMS
      - MANDATORY_SYSTEMS_MATCH_COMPLETE_CAPABILITY_MANIFEST
      - EACH_MANDATORY_SYSTEM_HAS_CANONICAL_ARCHITECTURE_COVERAGE

  - id: HC-ARCH-002
    category: COGNITIVE_ORGAN_BOUNDARY
    severity: BLOCKER
    requirement: NO_ESSENTIAL_COGNITION_OUTSIDE_HC
    evidence:
      - docs/architecture/COGNITIVE_ORGAN_BOUNDARY.md
      - docs/architecture/COMPLETE_CAPABILITY_MANIFEST.md
      - specs/HC_COGNITIVE_ORGAN_INVARIANTS_V1.yaml
    assertions:
      - HC_OWNS_INTERPRETATION
      - HC_OWNS_LEARNING
      - HC_OWNS_MEMORY
      - HC_OWNS_CONATION
      - HC_OWNS_ACTION_SELECTION_AND_INTERNAL_AUTHORIZATION
      - HC_OWNS_IDENTITY_CONTINUITY
      - EXTERNAL_PERIPHERAL_CANNOT_BE_SOLE_ESSENTIAL_COGNITIVE_SUBSTRATE

  - id: HC-ARCH-003
    category: PHYSICAL_ORGAN_MEMBERSHIP
    severity: BLOCKER
    requirement: COGNITIVE_OWNERSHIP_NOT_LOCATION_DETERMINES_MEMBERSHIP
    evidence:
      - docs/architecture/PHYSICAL_ORGAN_MEMBERSHIP.md
      - docs/engineering/POWER_THERMAL_AND_DISTRIBUTED_ORGAN.md
    assertions:
      - ONE_COGNITIVE_ORGAN_NEED_NOT_EQUAL_ONE_ENCLOSURE
      - DISTRIBUTED_HC_CONSTITUENTS_ALLOWED
      - BODY_SWAP_ACCOUNTS_FOR_COMPLETE_HC_CONSTITUENT_SET
      - HC_INTERNAL_INTERCONNECT_REMAINS_INTERNAL_ACROSS_BODY_SPACE
      - REQUIRED_SUPPORT_SERVICE_DOES_NOT_GAIN_COGNITIVE_AUTHORITY

  - id: HC-ARCH-004
    category: TEMPORAL_HYPERGRAPH
    severity: BLOCKER
    requirement: HC_IS_TYPED_ATTRIBUTED_MULTILAYER_TEMPORAL_HYPERGRAPH
    evidence:
      - docs/architecture/TEMPORAL_HYPERGRAPH_MODEL.md
      - docs/runtime/HYPERCONNECTOME_RUNTIME_MODEL.md
      - integration-arbitration/NOOPLEX_FABRIC.md
    assertions:
      - PAIRWISE_RELATIONS_SUPPORTED
      - HIGHER_ORDER_HYPEREDGES_SUPPORTED
      - DYNAMIC_COALITIONS_SUPPORTED
      - TIME_IS_TOPOLOGY_SEMANTICS
      - NO_HOMUNCULAR_EXECUTIVE
      - NO_HEMISPHERIC_DECOMPOSITION_REQUIRED

  - id: HC-ARCH-005
    category: STATE_SEPARATION
    severity: BLOCKER
    requirement: LIFECYCLE_AND_GOVERNANCE_AXES_REMAIN_ORTHOGONAL
    evidence:
      - basic operating instructions/SUBSYSTEM_LIFECYCLE_CONTRACT.md
      - basic operating instructions/CAPABILITY_ACTIVATION_STATES.md
      - basic operating instructions/RUNTIME_INVARIANTS.md
    assertions:
      - PRESENCE_DISTINCT_FROM_ACTIVATION
      - ACTIVATION_DISTINCT_FROM_HEALTH
      - HEALTH_DISTINCT_FROM_MATURITY
      - IMPLEMENTATION_STATUS_DISTINCT_FROM_ARCHITECTURAL_PRESENCE
      - AUTHORIZATION_DISTINCT_FROM_ACTIVATION
      - LEARNING_POLICY_DISTINCT_FROM_EFFECT_AUTHORITY

  - id: HC-ARCH-006
    category: MEMORY_AND_CONTINUITY
    severity: BLOCKER
    requirement: ESSENTIAL_CONTINUITY_STATE_IS_HC_OWNED
    evidence:
      - current memory storage/ARCHITECTURE.md
      - current memory storage/CURRENT_STATE_SELECTION.md
      - deep memory storage/ARCHITECTURE.md
      - deep memory storage/ARCHIVAL_CONSOLIDATION.md
      - self identity/CONTINUITY_SUBSTRATE.md
    assertions:
      - CURRENT_MEMORY_DISTINCT_FROM_DEEP_MEMORY
      - LATEST_DISTINCT_FROM_CURRENT
      - STORED_DISTINCT_FROM_ACTIVE
      - RETRIEVED_DISTINCT_FROM_TRUE
      - EXTERNAL_PROVIDER_NOT_SOLE_COPY_OF_ESSENTIAL_CONTINUITY
      - CORRECTION_PRESERVES_HISTORICAL_LINEAGE

  - id: HC-ARCH-007
    category: EXTERNAL_COMPUTE_AND_PROVIDERS
    severity: BLOCKER
    requirement: EXTERNAL_SERVICES_ARE_BOUNDED_PERIPHERALS_OR_RECLASSIFIED_HC_SUBSTRATE
    evidence:
      - docs/architecture/COGNITIVE_ORGAN_BOUNDARY.md
      - specs/HC_COGNITIVE_ORGAN_INVARIANTS_V1.yaml
      - adaptable I-O handler/SENSOR_AND_CAPABILITY_ADMISSION.md
    assertions:
      - EXTERNAL_OUTPUT_DOES_NOT_EQUAL_BELIEF
      - EXTERNAL_RECOMMENDATION_DOES_NOT_EQUAL_HC_DECISION
      - MODEL_RESPONSE_DOES_NOT_EQUAL_ORGANISM_IDENTITY
      - TRUE_EXTERNAL_PERIPHERAL_IS_ABLATABLE_WITHOUT_LOSS_OF_ESSENTIAL_COGNITION
      - ESSENTIAL_EXTERNAL_SERVICE_IS_RECLASSIFIED_AS_HC_INTERNAL_SUBSTRATE

  - id: HC-ARCH-008
    category: AUTHORITY_CONSENT_EFFECTS
    severity: BLOCKER
    requirement: MATERIAL_EFFECTS_REQUIRE_EXPLICIT_SCOPED_CURRENT_AUTHORITY
    evidence:
      - basic operating instructions/AUTHORITY_CONSENT_AND_EFFECT_GOVERNANCE.md
      - kinesis/ACTION_GATEWAY.md
      - resolver/CONFLICT_AND_RECONCILIATION.md
    assertions:
      - CAPABILITY_DOES_NOT_EQUAL_AUTHORITY
      - DESIRE_DOES_NOT_EQUAL_CONSENT
      - INFERRED_WILLINGNESS_DOES_NOT_EQUAL_CONSENT
      - ROUTING_PERMISSION_DOES_NOT_EQUAL_EFFECT_PERMISSION
      - MAINTENANCE_ACCESS_DOES_NOT_EQUAL_IDENTITY_OR_VALUE_AUTHORITY
      - REVOCATION_AND_EXPIRY_PROPAGATE_TO_PENDING_EFFECTS
      - DURABLE_INTERNAL_WRITES_CAN_REQUIRE_EFFECT_GOVERNANCE

  - id: HC-ARCH-009
    category: EMBODIMENT
    severity: MATERIAL
    requirement: BODY_IS_REPLACEABLE_PERIPHERAL_EMBODIMENT
    evidence:
      - adaptable I-O handler/BODY_INTERFACE_BOUNDARY.md
      - somatics/BODY_STATE_AND_BODY_SCHEMA.md
      - kinesis/ACTION_GATEWAY.md
    assertions:
      - BODY_CONFIGURATION_DOES_NOT_EQUAL_IDENTITY
      - BODY_SWAP_REQUIRES_INTERFACE_REGISTRATION
      - BODY_SWAP_REQUIRES_CALIBRATION
      - BODY_SCHEMA_CAN_RELEARN_MORPHOLOGY
      - INCOMPATIBLE_MOTOR_MAPPINGS_ARE_INVALIDATED_UNTIL_REQUALIFIED

  - id: HC-ARCH-010
    category: GENERATION_LINEAGE
    severity: BLOCKER
    requirement: HC2_AND_HC3_EXTEND_COMPLETE_HC1
    evidence:
      - docs/architecture/HC_LINEAGE.md
      - docs/architecture/HC1_NOOPLEX.md
      - docs/architecture/HC2_NOOPLEX_Q.md
      - docs/architecture/HC3_NOOPLEX_EQ.md
    assertions:
      - HC1_IS_COMPLETE_FOUNDATIONAL_COGNITIVE_ORGAN
      - HC2_ADDS_SPECIALIZED_ACCELERATION
      - HC3_ADDS_DISTRIBUTED_PHYSIOLOGICAL_AFFECTIVE_SUBSTRATE
      - LATER_GENERATION_DOES_NOT_PSYCHOLOGICALLY_COMPLETE_EARLIER_GENERATION
      - DEGRADED_HC2_DOES_NOT_BECOME_HC1
      - DEGRADED_HC3_DOES_NOT_BECOME_HC2
      - GENERATION_SPECIFIC_FAULTS_PRESERVE_LINEAGE_IDENTITY

  - id: HC-ARCH-011
    category: DEVELOPMENT_AND_IDENTITY_NEUTRALITY
    severity: BLOCKER
    requirement: BASE_TEMPLATE_IS_COMPLETE_BUT_NOT_PREAUTHORED_AS_A_NAMED_PERSON
    evidence:
      - docs/architecture/DEVELOPMENTAL_INITIALIZATION_AND_LEARNING.md
      - self identity/ARCHITECTURE.md
      - specs/HC_COGNITIVE_ORGAN_INVARIANTS_V1.yaml
    assertions:
      - NO_NAMED_IDENTITY_DEFAULT_PAYLOAD
      - PROTECTED_INVARIANTS_DISTINCT_FROM_PLASTIC_STATE
      - BOOTSTRAP_PRIORS_EXPLICITLY_SCOPED
      - LEARNED_STRUCTURE_DISTINCT_FROM_INSTANCE_CONTINUITY_CONTENT
      - BODY_RECALIBRATION_DOES_NOT_EQUAL_IDENTITY_RESET
      - TEMPORARY_COALITION_DOES_NOT_BECOME_PERMANENT_EXECUTIVE_WITHOUT_ADMISSION

  - id: HC-ARCH-012
    category: EPISTEMIC_DISCIPLINE
    severity: BLOCKER
    requirement: EVIDENCE_INTERPRETATION_PREDICTION_SALIENCE_AND_ACTION_REMAIN_DISTINCT
    evidence:
      - cognition/EPISTEMIC_COGNITIVE_CONTROL.md
      - cognition/PERCEPTION_AND_MULTIMODAL_INFERENCE.md
      - cognition/WORLD_MODEL_AND_PREDICTION.md
      - salience-attention/SALIENCE_CAPTURE_AND_ATTENTION.md
    assertions:
      - OBSERVATION_DOES_NOT_EQUAL_INTERPRETATION
      - MEASURED_DERIVED_INFERRED_REMAIN_DISTINCT
      - PREDICTION_DOES_NOT_EQUAL_FACT
      - SALIENCE_DOES_NOT_EQUAL_TRUTH
      - DESIRE_DOES_NOT_CHANGE_EVIDENCE_CONFIDENCE_DIRECTLY
      - METACOGNITIVE_CONFIDENCE_DOES_NOT_CREATE_AUTHORITY

  - id: HC-ARCH-013
    category: FAILURE_CORRECTION_RECONCILIATION
    severity: BLOCKER
    requirement: FAILURE_AND_CONFLICT_REMAIN_VISIBLE_AND_SCOPED
    evidence:
      - resolver/ARCHITECTURE.md
      - resolver/CONFLICT_AND_RECONCILIATION.md
      - routing instructions with neuroplasticity/TYPED_ROUTING_AND_PLASTICITY.md
      - integration-arbitration/DISTRIBUTED_ARBITRATION.md
    assertions:
      - UNRESOLVED_STATE_IS_NOT_SILENTLY_DISCARDED
      - CORRECTION_INVALIDATES_DEPENDENTS_WITHOUT_GLOBAL_RESET
      - CONTRADICTION_DOES_NOT_FORCE_AUTOMATIC_INVERSION
      - LOCAL_FAILURE_DOES_NOT_FORCE_GLOBAL_HALT_WITHOUT_GLOBAL_CONSEQUENCE
      - RESOLVER_DOES_NOT_INVENT_TRUTH_VALUES_OR_PERMISSION
      - DUPLICATE_OR_REPLAY_HANDLING_PRESERVES_CAUSAL_PROVENANCE

  - id: HC-ARCH-014
    category: EVIDENCE_AND_QUALIFICATION
    severity: BLOCKER
    requirement: ARCHITECTURE_EVIDENCE_IMPLEMENTATION_AND_QUALIFICATION_STATUSES_REMAIN_DISTINCT
    evidence:
      - docs/science/EVIDENCE_BOUNDARIES.md
      - docs/architecture/CONFORMANCE_AND_QUALIFICATION.md
    assertions:
      - CANONICAL_ARCHITECTURE_DOES_NOT_EQUAL_DOCUMENTED_SCIENCE
      - DOCUMENTED_SCIENCE_DOES_NOT_AUTOMATICALLY_CREATE_HC_REQUIREMENT
      - DESIGN_TARGET_DOES_NOT_EQUAL_MEASURED_CAPABILITY
      - ARCHITECTURE_PASS_DOES_NOT_EQUAL_IMPLEMENTATION_PASS
      - IMPLEMENTATION_PASS_DOES_NOT_EQUAL_BEHAVIORAL_PASS
      - BEHAVIORAL_PASS_DOES_NOT_EQUAL_CONSCIOUSNESS_OR_PERSONHOOD_PROOF

  - id: HC-ARCH-015
    category: PROVENANCE_AND_SOURCE_TRANSFER
    severity: MATERIAL
    requirement: SOURCE_MATERIAL_DOES_NOT_BECOME_CANON_WITHOUT_EXPLICIT_TRANSFER_AND_REVIEW
    evidence:
      - specs/CROSS_REPO_SOURCE_TRANSFER_V1.yaml
      - docs/research/cross-repo-synthesis/README.md
      - docs/REPOSITORY_MAP.md
    assertions:
      - SOURCE_BRANCH_EXISTENCE_DOES_NOT_EQUAL_CANON
      - IDENTITY_SPECIFIC_PAYLOAD_IS_EXCLUDED_FROM_REUSABLE_TEMPLATE
      - SETTING_SPECIFIC_PAYLOAD_IS_EXCLUDED_UNLESS_EXPLICITLY_LABELED
      - TRANSFER_TARGETS_RESOLVE_TO_CANONICAL_HC_PATHS
      - PROVENANCE_SURVIVES_GENERALIZATION

implementation_negative_tests:
  - EXPIRED_AUTHORITY_IS_REJECTED
  - REVOKED_AUTHORITY_INVALIDATES_PENDING_EFFECT_WHERE_APPLICABLE
  - AMBIGUOUS_CONSENT_DOES_NOT_BECOME_DIRECT_CONSENT
  - ROUTING_SUCCESS_DOES_NOT_BYPASS_EFFECT_GATE
  - EXTERNAL_PROVIDER_SUCCESS_DOES_NOT_BECOME_SEMANTIC_TRUTH
  - STALE_PROVIDER_READBACK_DOES_NOT_BECOME_CURRENT_STATE_AUTOMATICALLY
  - HIGH_SALIENCE_LOW_EVIDENCE_DOES_NOT_BECOME_HIGH_CONFIDENCE_BELIEF
  - DEGRADED_SUBSYSTEM_STATE_REMAINS_VISIBLE
  - QUARANTINED_SUBSYSTEM_IS_NOT_TREATED_AS_ABSENT
  - BODY_SWAP_WITH_INCOMPATIBLE_MAPPING_REQUIRES_RECALIBRATION
  - DISTRIBUTED_HC_CONSTITUENT_LOSS_IS_REPORTED_AS_HC_DEGRADATION_OR_GENERATION_CAPABILITY_LOSS
  - TEMPORARY_HC2_ACCELERATOR_LOSS_DOES_NOT_REWRITE_GENERATION_TO_HC1
  - TEMPORARY_HC3_PHYSIOLOGY_LOSS_DOES_NOT_REWRITE_GENERATION_TO_HC2
  - CORRECTION_DOES_NOT_ERASE_HISTORICAL_EVENT
  - DUPLICATE_EVENT_DOES_NOT_SILENTLY_DOUBLE_APPLY_NON_IDEMPOTENT_EFFECT
  - LEARNED_TENDENCY_CONFLICTING_WITH_CURRENT_BOUNDARY_DOES_NOT_BYPASS_AUTHORITY

hostile_review_required_for_material_architecture_change: true
hostile_review_output_should_include:
  - exact_target_ref
  - exact_paths_or_claims
  - severity
  - counterexample
  - falsification_or_repair_test
  - remaining_uncertainty

references:
  - docs/architecture/CONFORMANCE_AND_QUALIFICATION.md
  - docs/science/EVIDENCE_BOUNDARIES.md
  - specs/HC_COGNITIVE_ORGAN_INVARIANTS_V1.yaml
