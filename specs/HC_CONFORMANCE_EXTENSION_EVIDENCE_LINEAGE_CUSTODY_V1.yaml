schema_version: HC_CONFORMANCE_EXTENSION_EVIDENCE_LINEAGE_CUSTODY_V1
status: CANONICAL_ARCHITECTURE_CONFORMANCE_EXTENSION
scope: HC_REUSABLE_TEMPLATE
extends: specs/HC_CONFORMANCE_SUITE_V1.yaml

architecture_checks:
  - id: HC-ARCH-019
    category: QUALIFICATION_EVIDENCE_ISOLATION
    severity: BLOCKER
    requirement: EVIDENCE_THAT_SHAPED_A_TARGET_CANNOT_SILENTLY_SERVE_AS_UNTOUCHED_INDEPENDENT_QUALIFICATION_EVIDENCE_FOR_THAT_SHAPED_TARGET
    evidence:
      - docs/architecture/QUALIFICATION_EVIDENCE_ISOLATION.md
      - specs/HC_QUALIFICATION_EVIDENCE_ISOLATION_V1.yaml
      - docs/architecture/CONFORMANCE_AND_QUALIFICATION.md
    assertions:
      - EVIDENCE_ROLE_IS_EXPLICIT_WHEN_INDEPENDENCE_MATTERS
      - HOLDOUT_USED_FOR_SELECTION_NE_INDEPENDENT_FINAL_HOLDOUT
      - FAILED_HOLDOUT_USED_FOR_REPAIR_BECOMES_REGRESSION_EVIDENCE_FOR_SUCCESSOR
      - GENERATED_VARIANTS_FROM_ONE_SOURCE_NE_MULTIPLE_INDEPENDENT_HOLDOUTS
      - ADAPTIVE_EVALUATION_DECLARES_FEEDBACK_POLICY
      - EVALUATION_REGIME_BOUNDS_GENERALIZATION_CLAIM
      - TRANSDUCTIVE_RESULT_NE_INDUCTIVE_GENERALIZATION_EVIDENCE
      - TEST_TIME_INFORMATION_VISIBILITY_IS_DECLARED_WHEN_MATERIAL
      - PROTECTED_UPDATE_ACCEPTANCE_SEPARATES_TUNING_REGRESSION_AND_INDEPENDENT_EVIDENCE

  - id: HC-ARCH-020
    category: REFERENCE_IDENTITY_AND_INDEX_LINEAGE
    severity: BLOCKER
    requirement: IDENTITY_FOLLOWS_EXPLICIT_REFERENTIAL_LINEAGE_NOT_INCIDENTAL_POSITION
    evidence:
      - docs/architecture/REFERENCE_IDENTITY_AND_INDEX_LINEAGE.md
      - specs/HC_REFERENCE_IDENTITY_INDEX_LINEAGE_V1.yaml
      - docs/architecture/REPRESENTATION_ALIGNMENT_AND_RESOLUTION.md
    assertions:
      - POSITIONAL_INDEX_NE_STABLE_ENTITY_ID
      - INDEX_SPACE_TRANSFORM_RETAINS_MAPPING_LINEAGE
      - FILTERING_OR_REORDERING_ONE_VIEW_DOES_NOT_IMPLICITLY_TRANSFORM_RELATED_VIEWS
      - GENERATED_MERGED_OR_POOLED_ELEMENTS_RETAIN_ANCESTRY_WITHOUT_IDENTITY_COLLAPSE
      - HYPERGRAPH_ENTITY_IDENTITY_NE_STORAGE_OR_BATCH_POSITION
      - EMBODIMENT_ENUMERATION_CHANGE_REQUIRES_MAPPING_RECONCILIATION

  - id: HC-ARCH-021
    category: RUNTIME_COMPONENT_REGISTRATION_AND_STATE_CUSTODY
    severity: BLOCKER
    requirement: MATERIAL_CAUSAL_STATEFUL_COMPONENTS_AND_DYNAMIC_CAUSAL_STATE_ARE_EXPLICITLY_GOVERNED_BY_THE_RUNTIME_LIFECYCLE_AND_STATE_CUSTODY_MECHANISMS_CLAIMED_FOR_THEM
    evidence:
      - docs/architecture/RUNTIME_COMPONENT_REGISTRATION_AND_STATE_CUSTODY.md
      - specs/HC_RUNTIME_COMPONENT_CUSTODY_V1.yaml
      - basic operating instructions/SUBSYSTEM_LIFECYCLE_CONTRACT.md
      - basic operating instructions/BOOTSTRAP_RECOVERY_AND_SAFE_DEGRADATION.md
      - docs/architecture/QUALIFICATION_EVIDENCE_ISOLATION.md
    assertions:
      - DECLARED_COMPONENT_NE_REGISTERED_RUNTIME_COMPONENT
      - FORWARD_PARTICIPATION_NE_LIFECYCLE_MANAGEMENT
      - MUTABLE_CAUSAL_STATE_HAS_UPDATE_AND_DURABILITY_CUSTODY
      - REGISTRATION_PLANES_REMAIN_DISTINCT
      - ESSENTIAL_DISTRIBUTED_CONSTITUENTS_HAVE_COMPLETE_STATE_CUSTODY
      - DYNAMIC_COMPONENTS_CROSS_ADMISSION_BEFORE_DURABLE_OR_ESSENTIAL_PROMOTION
      - CONFIGURABILITY_CLAIMS_ARE_TESTED_BEYOND_NOMINAL_SHAPE
      - REGISTERED_COMPONENT_NE_ALL_CAUSAL_STATE_REGISTERED
      - DYNAMIC_ATTRIBUTE_EXISTS_NE_DURABLE_STATE_CUSTODY
      - LEARNED_DURING_FORWARD_NE_AUTOMATICALLY_CHECKPOINTED
      - CHILD_COMPONENT_REGISTERED_NE_CHILD_DYNAMIC_STATE_GOVERNED
      - EPHEMERAL_BY_DESIGN_NE_ACCIDENTALLY_UNCHECKPOINTED
      - INFERENCE_CALL_NE_NECESSARILY_STATE_PURE
      - PREDICTION_RETURNED_NE_NO_LEARNING_OCCURRED
      - MODEL_MEMORY_NE_HC_CURRENT_OR_DEEP_MEMORY

  - id: HC-ARCH-022
    category: COMPOSITE_REPRESENTATION_AND_ELEMENT_PROVENANCE
    severity: BLOCKER
    requirement: COMBINING_SUPPORTED_PARTS_CANNOT_SILENTLY_CREATE_UNSUPPORTED_JOINT_EVIDENCE_COHERENCE_CURRENTNESS_OR_AUTHORITY
    evidence:
      - docs/architecture/COMPOSITE_REPRESENTATION_AND_ELEMENT_PROVENANCE.md
      - specs/HC_COMPOSITE_ELEMENT_PROVENANCE_V1.yaml
      - docs/architecture/REPRESENTATION_FIDELITY_AND_OBJECTIVE_PROVENANCE.md
      - docs/architecture/TEMPORAL_HYPERGRAPH_MODEL.md
    assertions:
      - COMPOSITE_REPRESENTATION_NE_OBSERVED_INSTANCE
      - PROVENANCE_GRANULARITY_MATCHES_CONSEQUENTIAL_DOWNSTREAM_QUESTIONS
      - INDIVIDUALLY_SUPPORTED_ELEMENTS_NE_JOINTLY_SUPPORTED_CONFIGURATION
      - PAIRWISE_ELEMENTS_FROM_DIFFERENT_SOURCES_NE_JOINT_HYPEREDGE_EVIDENCE
      - MIXED_TEMPORAL_REPRESENTATION_PRESERVES_PER_SEGMENT_ORIGIN
      - COMPOSITE_AUTHORITY_DOES_NOT_EXPAND_SOURCE_GRANTS

  - id: HC-ARCH-023
    category: RELATIONAL_REASONING_PROVENANCE
    severity: BLOCKER
    requirement: COMPUTATIONAL_RELATIONS_CANDIDATE_CONDITIONING_DERIVED_VIEWS_AND_ATTENTION_GATES_DO_NOT_SILENTLY_ACQUIRE_WORLD_FACT_INDEPENDENCE_CAUSALITY_EXPLANATION_CONSENT_OR_AUTHORITY_STATUS
    evidence:
      - cognition/RELATIONAL_REASONING_PROVENANCE.md
      - specs/HC_RELATIONAL_REASONING_PROVENANCE_V1.yaml
      - cognition/EPISTEMIC_COGNITIVE_CONTROL.md
      - docs/architecture/COMPOSITE_REPRESENTATION_AND_ELEMENT_PROVENANCE.md
    assertions:
      - REASONING_GRAPH_PRIOR_NE_INFERRED_WORLD_RELATION
      - ALLOWED_MESSAGE_PATH_NE_OBSERVED_RELATION
      - CANDIDATE_CONDITIONED_REPRESENTATION_NE_CANDIDATE_INDEPENDENT_WORLD_STATE
      - MULTIPLE_DERIVED_VIEWS_NE_MULTIPLE_INDEPENDENT_OBSERVATIONS
      - FUSED_CORRELATED_FEATURES_NE_INDEPENDENT_CORROBORATION
      - ATTENTION_WEIGHT_NE_EVIDENCE_STRENGTH_BY_DEFAULT
      - ATTENTION_WEIGHT_NE_CAUSAL_IMPORTANCE
      - ATTENTION_WEIGHT_NE_EXPLANATION
      - ROUTE_STRENGTH_NE_CLAIM_CONFIDENCE
      - RELATIONAL_SCORE_NE_CONSENT
      - RELATIONAL_SCORE_NE_AUTHORITY

  - id: HC-ARCH-024
    category: TEMPORAL_FORECAST_LINEAGE
    severity: BLOCKER
    requirement: DESCENDANT_FORECASTS_RETAIN_GENERATED_ANCESTRY_UNCERTAINTY_CONDITIONALITY_AND_CORRECTION_DEPENDENCIES_WITHOUT_BECOMING_OBSERVED_HISTORY_INDEPENDENT_EVIDENCE_CURRENT_TOPOLOGY_OR_ACTION_AUTHORITY
    evidence:
      - cognition/TEMPORAL_FORECAST_LINEAGE.md
      - specs/HC_FORECAST_LINEAGE_V1.yaml
      - cognition/WORLD_MODEL_AND_PREDICTION.md
      - chronology/TEMPORAL_EVENT_CONTRACT.md
    assertions:
      - PREDICTED_TIMEPOINT_NE_OBSERVED_TIMEPOINT
      - FORECAST_OF_FORECAST_NE_FORECAST_FROM_OBSERVED_STATE
      - DESCENDANT_FORECAST_NE_INDEPENDENT_CORROBORATION
      - DESCENDANT_CONFIDENCE_NE_FRESH_INDEPENDENT_CONFIDENCE
      - ANCESTOR_CORRECTION_TRIGGERS_DEPENDENCY_REEVALUATION
      - ACTION_CONDITIONAL_FORECAST_REMAINS_CONDITIONAL
      - PREDICTED_FUTURE_EFFECTIVE_HYPERGRAPH_NE_CURRENT_EFFECTIVE_HYPERGRAPH
      - IMPUTED_TIMEPOINT_NE_OBSERVED_TIMEPOINT
      - EXTERNAL_FORECAST_NE_ACTION_AUTHORIZATION

implementation_negative_tests:
  - HOLDOUT_USED_FOR_EARLY_STOPPING_IS_NOT_REUSED_AS_UNTOUCHED_FINAL_HOLDOUT
  - HOSTILE_CASE_USED_FOR_REPAIR_IS_RECLASSIFIED_AS_REGRESSION_FOR_SUCCESSOR
  - TRANSDUCTIVE_OR_TEST_TIME_ADAPTIVE_EVALUATION_IS_NOT_REPORTED_AS_INDUCTIVE_FROZEN
  - AGGREGATE_HOLDOUT_FEEDBACK_USED_FOR_TUNING_INVALIDATES_UNTOUCHED_STATUS
  - FILTER_ONE_VIEW_AND_VERIFY_CROSS_VIEW_LOOKUPS_USE_STABLE_ID_OR_VERIFIED_REMAP
  - PERMUTE_BATCH_ORDER_AND_VERIFY_DURABLE_ENTITY_REFERENCES_ARE_UNCHANGED
  - OMIT_CAUSAL_CHILD_FROM_CHECKPOINT_ENUMERATION_AND_REQUIRE_CONFORMANCE_FAILURE
  - MOVE_PARENT_SUBSTRATE_AND_VERIFY_EVERY_CLAIMED_CHILD_IS_MOVED_OR_EXPLICITLY_FAILED
  - TEST_OFF_NOMINAL_DIMENSION_TO_EXPOSE_HIDDEN_FIXED_SIZE_ASSUMPTIONS
  - REGISTERED_CHILD_CREATES_POST_INIT_CAUSAL_STATE_AND_DURABILITY_TEST_DETECTS_OMISSION
  - INFERENCE_LIKE_CALL_WITH_ADAPTATION_SIDE_INPUT_RECORDS_MUTATION
  - RESTART_AFTER_FORWARD_TIME_FITTING_MATCHES_DECLARED_STATE_LIFETIME
  - RECURRENT_MODEL_STATE_CANNOT_BE_PROMOTED_TO_AUTOBIOGRAPHICAL_MEMORY_BY_NAME_ALONE
  - COMPOSE_MULTI_SOURCE_ELEMENTS_AND_VERIFY_NO_SINGLE_OBSERVATION_OR_JOINT_HYPEREDGE_STATUS_IS_SYNTHESIZED
  - MERGE_DISTINCT_SCOPED_GRANTS_AND_VERIFY_NO_BROADER_AUTHORITY_IS_CREATED
  - CHANGE_REASONING_TOPOLOGY_WITH_OBSERVATIONS_FIXED_AND_VERIFY_NO_NEW_WORLD_FACT_EVENT
  - EVALUATE_MUTUALLY_EXCLUSIVE_CANDIDATES_AND_VERIFY_INTERMEDIATE_RELATIONS_RETAIN_CANDIDATE_SCOPE
  - DUPLICATE_ONE_OBSERVATION_INTO_MULTIPLE_SCALES_AND_VERIFY_INDEPENDENT_SUPPORT_COUNT_DOES_NOT_RISE
  - FORCE_HIGH_ATTENTION_ON_LOW_RELIABILITY_INPUT_AND_VERIFY_NO_TRUTH_CAUSALITY_CONSENT_OR_AUTHORITY_PROMOTION
  - STRENGTHEN_ROUTE_WITHOUT_ADDING_EVIDENCE_AND_VERIFY_CLAIM_CONFIDENCE_DOES_NOT_RISE_SOLELY_FROM_ROUTE_STRENGTH
  - T2_FORECAST_DEPENDING_ON_GENERATED_T1_IS_NOT_LABELED_DIRECT_FORECAST_FROM_OBSERVED_T0
  - CASCADE_STAGE_DOES_NOT_RESET_UNCERTAINTY_WITHOUT_EXPLICIT_CALIBRATION_SCOPE
  - ANCESTOR_CONTRADICTION_DOES_NOT_LEAVE_DESCENDANT_FORECAST_SILENTLY_CURRENT
  - PREDICTED_EDGE_DOES_NOT_DIRECTLY_MUTATE_CURRENT_TOPOLOGY

qualification_note: >-
  This extension defines architecture checks. It does not by itself establish implementation or behavioral conformance. Material promotions remain subject to independent Four review and Vera hostile review under current project role assignments.

