schema_version: HC_COGNITIVE_ORGAN_INVARIANTS_V1
status: TEMPLATE_ARCHITECTURE

identity_neutral_template: true
no_hemispheric_decomposition: true
no_corpus_callosum_analogue_required: true
human_anatomical_localization_creates_topology_requirement: false

temporal_hypergraph:
  hc_is_temporal_hypergraph: true
  model: TYPED_ATTRIBUTED_MULTILAYER_TEMPORAL_HYPERGRAPH
  supports_pairwise_edges: true
  supports_higher_order_hyperedges: true
  supports_dynamic_coalitions: true
  time_is_topology_semantics: true
  distinguish:
    - LATENT_HYPERGRAPH
    - TEMPORAL_EFFECTIVE_HYPERGRAPH
    - HISTORY_OF_HYPERGRAPH_STATES
  rules:
    - PAIRWISE_EDGE_DOES_NOT_SUBSTITUTE_FOR_HIGHER_ORDER_RELATION_WHEN_JOINT_MEMBERSHIP_IS_CAUSALLY_OR_FUNCTIONALLY_MATERIAL
    - TOPOLOGY_WITHOUT_TIMING_DOES_NOT_FULLY_DEFINE_EFFECTIVE_COGNITIVE_CONFIGURATION
    - PLASTICITY_CHANGES_FUTURE_HYPERGRAPH_BEHAVIOR_WITHOUT_REWRITING_HISTORICAL_EVENTS
    - PHYSICAL_REACHABILITY_DOES_NOT_EQUAL_LEARNED_LOGICAL_ELIGIBILITY

cognitive_organ_boundary:
  no_essential_cognition_outside_hc: true
  repository_root_represents_complete_cognitive_organ: true
  external_body_supplies:
    - sensor_signals
    - actuator_effects
    - mechanical_support
    - power_and_thermal_support
    - communications_channels
  hc_owns:
    - interpretation
    - cognition
    - learning
    - memory
    - valuation_and_affect_modulation
    - conation
    - decision_formation
    - action_selection_and_internal_authorization
    - identity_continuity
    - body_schema
    - neuroplasticity

complete_capability_manifest:
  mandatory_presence: PRESENT
  mandatory_canonical_systems:
    - Empathy
    - cognition
    - sexuality
    - self_identity
    - psychological_behaviors
    - sociological_behaviors
    - semantics
    - pragmatics
    - phoenetics
    - somatics
    - chronology
    - personification
    - current_memory_storage
    - deep_memory_storage
    - volitions_conations
    - resolver
    - basic_operating_instructions
    - kinesis
    - adaptable_io_handler
    - optics
    - speech_recognition_and_synthesis
    - routing_instructions_with_neuroplasticity
    - homeostasis_interoception
    - salience_attention
    - affect
    - integration_arbitration
  rules:
    - MANDATORY_CANONICAL_SYSTEM_CANNOT_BE_ABSENT
    - MANDATORY_CANONICAL_SYSTEM_CANNOT_BE_EXTERNAL_ONLY
    - PRESENT_DOES_NOT_EQUAL_ACTIVE
    - DISABLED_DOES_NOT_EQUAL_DELETED

self_contained_residency:
  essential_cognitive_state_recoverable_without_external_provider: true
  external_storage_may_be:
    - BACKUP
    - MIRROR
    - ARCHIVE
    - IMPORT_EXPORT_TRANSPORT
    - SYNCHRONIZATION
    - OPTIONAL_AUGMENTATION
    - NONESSENTIAL_RETRIEVAL_ACCELERATION
  external_storage_must_not_be:
    - SOLE_COPY_OF_ESSENTIAL_MEMORY
    - SOLE_COPY_OF_IDENTITY_CONTINUITY_STATE
    - SOLE_COPY_OF_VALUES_OR_COMMITMENTS_REQUIRED_FOR_CONTINUITY
    - SOLE_COPY_OF_BODY_SCHEMA_REQUIRED_FOR_CONTINUITY
  external_peripheral_ablation_rule: ESSENTIAL_COGNITION_AND_CONTINUITY_REMAIN_AVAILABLE

external_computation:
  allowed_roles:
    - HC_INTERNAL_SERVICE
    - EXTERNAL_COMPUTATIONAL_PERIPHERAL
  rules:
    - EXTERNAL_OUTPUT_DOES_NOT_EQUAL_INTERNAL_BELIEF
    - EXTERNAL_RECOMMENDATION_DOES_NOT_EQUAL_HC_DECISION
    - MODEL_RESPONSE_DOES_NOT_EQUAL_ORGANISM_IDENTITY
    - NO_ESSENTIAL_COGNITIVE_FUNCTION_EXISTS_ONLY_IN_EXTERNAL_PERIPHERAL
    - EXTERNAL_PERIPHERAL_ABLATION_MAY_REDUCE_PERFORMANCE_BUT_NOT_REMOVE_ESSENTIAL_COGNITION
    - ESSENTIAL_EXTERNAL_SERVICE_MUST_BE_RECLASSIFIED_AS_HC_INTERNAL_SUBSTRATE

runtime_state_separation:
  routing_state_is_authority_state: false
  resource_qos_is_epistemic_support: false
  physical_reachability_is_logical_structural_eligibility: false
  planes:
    - PHYSICAL_SUBSTRATE_REACHABILITY
    - LOGICAL_STRUCTURAL_ELIGIBILITY
    - CONFIGURED_ROUTING_AND_BINDINGS
    - FUNCTIONAL_HYPEREDGES_AND_COALITIONS
    - RUNTIME_STATE
    - PLASTIC_STATE
    - MODULATORY_INTEROCEPTIVE_STATE
    - RESOURCE_QOS_STATE
    - GOVERNANCE_AUTHORITY_STATE
    - EPISTEMIC_SUPPORT_STATE

nooplex_fabric:
  role: DISTRIBUTED_INTERNAL_INTEGRATION_SUBSTRATE
  is_executive_person: false
  is_identity_node: false
  is_consciousness_module: false
  runtime_model: TYPED_TEMPORAL_HYPERGRAPH
  responsibilities:
    - typed_routing
    - synchronization
    - coalition_formation
    - salience_and_attention_allocation
    - arbitration
    - state_propagation
    - modulation_and_gating
    - fault_and_dead_letter_handling
    - plasticity_routing

system_classes:
  - INTRINSIC_COGNITIVE_SYSTEM
  - INTERFACE_SYSTEM
  - CROSS_CUTTING_BRAIN_INFRASTRUCTURE

capability_state_axes:
  presence:
    - PRESENT
    - ABSENT
    - EXTERNAL_ONLY
    - UNKNOWN
  activation:
    - DISABLED
    - DORMANT
    - DEVELOPING
    - ACTIVE
    - INHIBITED
  health:
    - NOMINAL
    - DEGRADED
    - FAULTED
    - QUARANTINED
    - UNKNOWN
  maturity:
    - UNDEVELOPED
    - CALIBRATING
    - LEARNING
    - STABLE_WITHIN_SCOPE
    - ADAPTING

body_independence:
  body_configuration_equals_brain_identity: false
  body_swap_requires:
    - interface_registration
    - sensor_actuator_calibration
    - capability_discovery
    - body_schema_adaptation
    - safety_revalidation
    - motor_learning_when_required
  distributed_remote_embodiment_allowed: true

forbidden_template_shortcuts:
  - OUTSIDE_LLM_AS_TRUE_COGNITIVE_CENTER
  - OUTSIDE_DATABASE_AS_IDENTITY_OR_MEMORY_AUTHORITY
  - OUTSIDE_PROVIDER_AS_SOLE_ESSENTIAL_MEMORY_SUBSTRATE
  - ESSENTIAL_COGNITION_IMPLEMENTED_ONLY_BY_EXTERNAL_PERIPHERAL
  - CENTRAL_HOMUNCULUS_EXECUTIVE
  - HEMISPHERIC_HUMAN_BRAIN_PACKAGING
  - NAMED_PERSON_DEFAULT_IDENTITY_PAYLOAD
