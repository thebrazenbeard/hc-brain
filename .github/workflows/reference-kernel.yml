name: Reference Kernel

on:
  push:
    paths:
      - "runtime/reference_kernel/**"
      - ".github/workflows/reference-kernel.yml"
  pull_request:
    paths:
      - "runtime/reference_kernel/**"
      - ".github/workflows/reference-kernel.yml"

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reference-kernel tests
        working-directory: runtime/reference_kernel
        run: python -m unittest -v test_hc_kernel.py
